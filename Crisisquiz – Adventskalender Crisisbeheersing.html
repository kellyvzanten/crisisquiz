<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crisisquiz – Adventskalender Crisisbeheersing</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#0d2757;--bg2:#07142f;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);
  --text:#fff;--muted:#c3d0ea;--gold:#ffd166;--ok:#2ea36a;--bad:#e8504a;--onGold:#0d2757;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg1:#eaf1fc;--bg2:#cfe0f7;--card:#fff;--line:#c4d3ec;--text:#0d2757;--muted:#46608f;--gold:#e0a21a;--onGold:#fff;color-scheme:light}
}
:root[data-theme="light"]{--bg1:#eaf1fc;--bg2:#cfe0f7;--card:#fff;--line:#c4d3ec;--text:#0d2757;--muted:#46608f;--gold:#e0a21a;--onGold:#fff;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow-x:hidden}
.flake{position:fixed;top:-10px;border-radius:50%;background:#fff;opacity:.55;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
@media (prefers-reduced-motion:reduce){.flake{display:none}}
main{width:100%;max-width:640px;position:relative;z-index:1}
.badge{display:inline-block;background:var(--gold);color:var(--onGold);font-weight:800;letter-spacing:.14em;font-size:.78rem;padding:7px 16px;border-radius:99px}
h1{font-size:clamp(2rem,7vw,2.8rem);line-height:1.05;margin:14px 0 6px;font-weight:800}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:0 0 22px;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;backdrop-filter:blur(6px);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px;transition:width .4s}
.count{color:var(--muted);font-size:.85rem;margin-bottom:16px}
h2{font-size:1.3rem;line-height:1.3;margin:0 0 18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:.9rem}
.opt.ok{border-color:var(--ok);background:rgba(46,163,106,.2)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:rgba(232,80,74,.18)}
.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;background:rgba(255,209,102,.14);border-left:4px solid var(--gold);line-height:1.5;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.fb strong{display:block;margin-bottom:4px}
.btn{margin-top:18px;font:inherit;font-weight:700;background:var(--gold);color:var(--onGold);border:0;border-radius:99px;padding:13px 26px;cursor:pointer;transition:transform .12s}
.btn:hover{transform:scale(1.04)}
.res{text-align:center}
.emoji{font-size:3.4rem}
.score{font-size:3rem;font-weight:800;color:var(--gold);margin:4px 0}
.res p{line-height:1.55;color:var(--muted)}
.cta{margin-top:16px;padding:14px;border:1.5px dashed var(--gold);border-radius:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <span class="badge">ADVENTSKALENDER · CRISISBEHEERSING</span>
  <h1>De <span>Crisisquiz</span></h1>
  <p class="sub">Vijf vragen. Nul paniek. Hoeveel weet jij over crisisbeheersing?</p>
  <section class="card" id="card"></section>
</main>
<script>
var Q=[
{q:"Wat betekent GRIP, bekend uit het nieuws bij incidenten?",o:["Goed Raadplegen In Paniek","Gecoördineerde Regionale Incidentbestrijdingsprocedure","Gemeentelijke Reddingsploeg In Pyjama"],a:1,t:"Een mondvol, maar het is de afspraak waarmee hulpdiensten en gemeente samenwerken. Hoe hoger het GRIP-niveau, hoe groter en gecoördineerder de aanpak."},
{q:"Wie is bij een ramp of crisis in de gemeente de opperbevelhebber?",o:["De gemeentesecretaris, want die kent alle dossiers","De burgemeester","De collega met de grootste snor"],a:1,t:"De burgemeester heeft het opperbevel. Bij GRIP 4 en hoger neemt de voorzitter van de veiligheidsregio dat over, en dat is ook een burgemeester."},
{q:"Welke taak hoort bij bevolkingszorg, oftewel bij ons als gemeente?",o:["Branden blussen","Verdachten aanhouden","Opvang en verzorging van getroffen inwoners"],a:2,t:"Bevolkingszorg zorgt voor opvang, informatie en nazorg. Daar zijn collega’s van onder meer communicatie, burgerzaken en het sociaal domein bij nodig, dus het kan zomaar jouw club zijn."},
{q:"Wat moet je doen om een NL-Alert op je telefoon te krijgen?",o:["De NL-Alert-app downloaden","Je aanmelden bij de gemeente","Niets aanmelden, alleen controleren of NL-Alert aan staat"],a:2,t:"NL-Alert komt via het mobiele netwerk, zonder app of aanmelding. Check wel even in je telefooninstellingen dat hij niet is uitgezet. Dat kost je één minuut."},
{q:"Het is december, de stroom valt uit en het is pikkedonker. Wat is het veiligst?",o:["Een zaklamp of ledlamp","Twintig kaarsen voor de sfeer","Een vuurtje in de woonkamer"],a:0,t:"Kaarsen zijn gezellig, maar ook een bekende oorzaak van brand tijdens stroomuitval. Houd een zaklamp met batterijen binnen handbereik en zorg dat je minstens drie dagen kunt overbruggen."}
];
var i=0,s=0,done=false,card=document.getElementById("card");
function esc(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function show(){
  done=false;var q=Q[i],L=["A","B","C"];
  card.innerHTML='<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="count">Vraag '+(i+1)+' van '+Q.length+'</div><h2>'+esc(q.q)+'</h2><div id="opts"></div><div id="fb"></div><div id="nx"></div>';
  var o=document.getElementById("opts");
  q.o.forEach(function(t,k){var b=document.createElement("button");b.className="opt";b.type="button";b.innerHTML="<b>"+L[k]+"</b><span>"+esc(t)+"</span>";b.onclick=function(){pick(k)};o.appendChild(b)});
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=document.querySelectorAll(".opt");
  bs.forEach(function(b,n){b.disabled=true;if(n===q.a)b.classList.add("ok");else if(n===k)b.classList.add("bad")});
  var right=k===q.a;if(right)s++;
  document.getElementById("fb").innerHTML='<div class="fb"><strong>'+(right?"Goed zo! 🎉":"Net niet, maar dat is geen ramp. 😉")+"</strong>"+esc(q.t)+"</div>";
  var n=document.getElementById("nx");n.innerHTML='<button class="btn" type="button">'+(i<Q.length-1?"Volgende vraag →":"Bekijk mijn score →")+"</button>";
  n.firstChild.onclick=function(){i++;i<Q.length?show():end()};n.firstChild.focus();
}
function end(){
  var m=s===5?["🏆","Crisisproof! Bij een ramp bel ik jou als eerste."]:s>=3?["👏","Sterk bezig! Jij houdt het hoofd koel als het erop aankomt."]:["💡","Goed dat je meedeed! Je weet nu weer iets meer, en dat is precies de bedoeling."];
  card.innerHTML='<div class="res"><div class="emoji">'+m[0]+'</div><div class="score">'+s+" / "+Q.length+"</div><h2>"+m[1]+'</h2><p>Een crisis voorkom je niet altijd, maar goed voorbereid zijn helpt enorm. Dank voor het meedoen!</p><div class="cta">Benieuwd naar de crisisorganisatie van onze gemeente, of wil je weten of die iets voor jou is? Spreek de adviseur crisisbeheersing gerust aan.</div><button class="btn" type="button" id="again">Nog een keer</button></div>';
  document.getElementById("again").onclick=function(){i=0;s=0;show()};
}
for(var f=0;f<16;f++){var d=document.createElement("div");d.className="flake";var z=3+Math.random()*4;d.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(9+Math.random()*10)+"s;animation-delay:-"+Math.random()*15+"s";document.body.appendChild(d)}
show();
</script>
</body>
</html>
